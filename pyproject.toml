[project]
name = "prim"
version = "0.1.0"
description = "Meta-learning for root cause analysis in causal systems"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "causal-learn>=0.1.4.4",
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.3",
    "torch>=2.10.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
baselines = [
    # setuptools>=81 dropped pkg_resources, which sfr-pyrca imports at startup.
    # sfr-pyrca itself is NOT declared here: its metadata claims
    # scikit-learn>=0.24,<1.2, which conflicts with our own scikit-learn>=1.8.0
    # and makes uv's resolver reject the whole environment (confirmed by
    # trying it) -- even though the actual code works fine with modern
    # scikit-learn. It's installed with --no-deps by scripts/install_baselines.sh
    # instead, which also re-pins setuptools after every `uv sync`/`uv run`
    # sync (both silently drop it otherwise, see that script's comments).
    "setuptools<81",
    "pyyaml",
    "dill",
    "dowhy",
    # RCAEval baselines (prim/evaluation/rcaeval_baro.py, test_extra_baselines.py):
    # RCAEval itself declares no install_requires (its own "default" extra
    # pulls in a huge, mostly irrelevant lockfile), so its actual runtime deps
    # are listed here instead. requests is needed just to import
    # RCAEval.utility; pingouin/tigramite back circa/easyrca/microcause;
    # scikit-network/python-igraph back causalrca.
    "RCAEval",
    "requests",
    "pingouin",
    "tigramite",
    "scikit-network",
    "python-igraph",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prim"]

[tool.uv.sources]
# git, not a local editable path: a path source must be resolvable to build
# ANY lock (uv locks are universal across extras), which broke `uv sync` on a
# completely fresh checkout with no vendored repos yet -- confirmed by testing
# from a clean clone. The vendored RCAEval-main/ clone (see README) is an
# unmodified upstream checkout, so installing from git is equivalent.
RCAEval = { git = "https://github.com/phamquiluan/RCAEval" }
sfr-pyrca = { git = "https://github.com/salesforce/PyRCA.git" }

[tool.ruff.lint.per-file-ignores]
# These scripts insert vendored repos into sys.path before importing from them.
"prim/evaluation/test_causrca.py" = ["E402"]
"prim/evaluation/test_causrca_baselines.py" = ["E402"]
"prim/evaluation/test_extra_baselines.py" = ["E402"]
